spring.application.name=StylePin
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/stylepin
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Seed ~40 demo outfits and products on startup. Set to false in production.
stylepin.seed-data.enabled=true
# JWT_SECRET is a Base64-encoded random key of at least 32 bytes.
stylepin.auth.jwt-secret=${JWT_SECRET}
stylepin.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
stylepin.auth.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173}
server.error.include-message=never
server.error.include-stacktrace=never

